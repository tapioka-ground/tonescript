[package]
name = "tonescript-app"
description = "Tonescript の画面。曲を選び、譜面を見て、鳴らす。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "tone-app"
path = "src/main.rs"

[features]
# Windows で遅れを詰めたいとき。ASIO SDK と LLVM が要るので既定では入れない
# （入れていない機械ではビルドすら通らない）。README の「低遅延」を見ること
asio = ["cpal/asio"]

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"
tonescript-dsp = { path = "../dsp" }
tonescript-song = { path = "../song" }
tonescript-render = { path = "../render" }
tonescript-engine = { path = "../engine" }
tonescript-project = { path = "../project" }
tonescript-midi = { path = "../midi" }
cpal = "0.15"
midir = "0.10"
